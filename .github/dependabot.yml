version: 2
updates:
  # Go modules (Gap #23 — automated dependency updates)
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "zippyra/backend-team"
    labels:
      - "dependencies"
      - "go"

  # npm packages (web apps)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "zippyra/web-team"
    labels:
      - "dependencies"
      - "javascript"

  # pub packages (Flutter apps)
  - package-ecosystem: "pub"
    directory: "/mobile/customer_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"

  - package-ecosystem: "pub"
    directory: "/mobile/staff_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Terraform modules
  - package-ecosystem: "terraform"
    directory: "/infra/environments/pilot"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"
