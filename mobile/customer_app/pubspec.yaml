name: customer_app
description: Zippyra Customer Self-Checkout Mobile App
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  zippyra_core:
    path: ../packages/zippyra_core
  flutter_bloc: ^8.1.3
  get_it: ^9.2.1
  go_router: ^13.2.0
  google_sign_in: ^6.2.1
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  mobile_scanner: ^5.0.0
  cached_network_image: ^3.3.1
  sqlite3_flutter_libs: ^0.5.0
  stream_transform: ^2.1.0
  equatable: ^2.0.5
  razorpay_flutter: ^1.3.6
  qr_flutter: ^4.1.0
  lottie: ^3.1.2
  share_plus: ^9.0.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
